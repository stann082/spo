name: Build and test
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and test
    # The monitor targets a Windows TFM for its toast notifications.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Build restores for itself: the exes only set their win-x64 runtime in Release, so a
      # separate configuration-less restore would leave that runtime out of the assets file.
      - name: Build
        run: dotnet build spo.slnx -c Release
      - name: Test
        run: dotnet test spo.slnx --no-build -c Release
